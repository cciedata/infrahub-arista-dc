---
# DC3 segments: VLAN, L2 VNI, VRF and a /24 prefix per segment; sites [DC3] only.
# Segment names must be unique (other files reference segments by name, e.g. `access_segment` in
# dc3-10-lab-host-ports.yml), so DC3 names carry the site: DC3- in front, or in the name (CITRIX-DC3-1500).
# VLAN / L2 VNI reuse across segment objects is allowed.
# Load after dc3-06-fabric.yml (DC3 instance: main; an Infrahub instance that also holds other sites: a branch,
# for example dc3).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
