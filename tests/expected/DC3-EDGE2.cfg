hostname DC3-EDGE2
!
service routing protocols model multi-agent
!
spanning-tree mode mstp
spanning-tree mst 0 priority 8192
!
aaa authentication login default local
aaa authorization exec default local
!
username dc3-automation privilege 15 role network-admin secret sha512 __DC3_AUTOMATION_HASH__
!
vlan 3200
   name DC3-EDGE-OUTSIDE
!
vlan 3900
   name VPC-BACKUP-UNDERLAY
   trunk group MLAGPEER
!
no spanning-tree vlan-id 3900
!
vrf instance MGMT
!
vrf instance VPC-KEEPALIVE
!
interface Port-Channel11
   description DC3-INETFW1 agg-outside
   switchport mode trunk
   switchport trunk allowed vlan 3200
   mlag 11
   spanning-tree portfast
   spanning-tree bpduguard enable
!
interface Port-Channel13
   description DC3-SDWANFW1 agg-outside
   switchport mode trunk
   switchport trunk allowed vlan 3200
   mlag 13
   spanning-tree portfast
   spanning-tree bpduguard enable
!
interface Port-Channel15
   description DC3-VPNFW1 agg-outside
   switchport mode trunk
   switchport trunk allowed vlan 3200
   mlag 15
   spanning-tree portfast
   spanning-tree bpduguard enable
!
interface Port-Channel21
   description DC3-ISP1 BE21
   switchport mode trunk
   switchport trunk allowed vlan 3200
   mlag 21
   spanning-tree portfast
   spanning-tree bpduguard enable
!
interface Port-Channel22
   description DC3-ISP2 BE21
   switchport mode trunk
   switchport trunk allowed vlan 3200
   mlag 22
   spanning-tree portfast
   spanning-tree bpduguard enable
!
interface Port-Channel1000
   description DC3-EDGE1 Port-Channel1000
   switchport mode trunk
   switchport trunk group MLAGPEER
!
interface Ethernet1/1
   description DC3-EDGE1 Ethernet1/1
   no shutdown
   channel-group 1000 mode active
!
interface Ethernet2/1
   description DC3-EDGE1 Ethernet2/1
   no shutdown
   channel-group 1000 mode active
!
interface Ethernet3/1
   description DC3-EDGE1 Ethernet3/1
   no shutdown
   channel-group 1000 mode active
!
interface Ethernet4/1
   description DC3-EDGE1 Ethernet4/1
   no shutdown
   channel-group 1000 mode active
!
interface Ethernet5/1
   description DC3-ISP1 Gi0-0-0-1
   no shutdown
   channel-group 21 mode active
!
interface Ethernet6/1
   description DC3-ISP2 Gi0-0-0-1
   no shutdown
   channel-group 22 mode active
!
interface Ethernet7/1
   description DC3-INETFW1 port22
   no shutdown
   channel-group 11 mode active
!
interface Ethernet9/1
   description DC3-SDWANFW1 port40
   no shutdown
   channel-group 13 mode active
!
interface Ethernet11/1
   description DC3-VPNFW1 port40
   no shutdown
   channel-group 15 mode active
!
interface Ethernet34
   description DC3-EDGE1 Ethernet34
   no shutdown
   mtu 9214
   no switchport
   vrf VPC-KEEPALIVE
   ip address 10.27.17.7/31
!
interface Management1
   description OOB management
   vrf MGMT
   ip address 10.250.32.29/24
!
interface Vlan3900
   description DC3-EDGE1 Vlan3900
   mtu 9214
   no autostate
   ip address 10.27.3.7/31
!
no ip routing vrf MGMT
!
ip route vrf MGMT 0.0.0.0/0 10.250.32.1
!
mlag configuration
   domain-id DC3-MLAG-EDGE1-EDGE2
   local-interface Vlan3900
   peer-address 10.27.3.6
   peer-address heartbeat 10.27.17.6 vrf VPC-KEEPALIVE
   peer-link Port-Channel1000
   heartbeat-interval 4000
   dual-primary detection delay 5 action errdisable all-interfaces
   dual-primary recovery delay mlag 360 non-mlag 300
   reload-delay mlag 360
   reload-delay non-mlag 360
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
end