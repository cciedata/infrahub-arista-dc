hostname DC3-SL1
!
service routing protocols model multi-agent
!
spanning-tree mode mstp
spanning-tree mst 0 priority 8192
!
aaa authentication login default local
aaa authorization exec default local
!
username dc3-automation privilege 15 role network-admin secret sha512 __DC3_AUTOMATION_HASH__
!
vlan 3000
   name DC3-TRANSIT-INTFW
!
vlan 3100
   name DC3-PROD-INTFW
!
vlan 3101
   name DC3-DEV-INTFW
!
vlan 3105
   name DC3-CITRIX-INTFW
!
vlan 3106
   name DC3-PARTNER-INTFW
!
vlan 3900
   name VPC-BACKUP-UNDERLAY
   trunk group MLAGPEER
!
no spanning-tree vlan-id 3900
!
vrf instance CITRIX
!
vrf instance DEV
!
vrf instance MGMT
!
vrf instance PARTNER
!
vrf instance PROD
!
vrf instance TRANSIT
!
vrf instance VPC-KEEPALIVE
!
interface Port-Channel11
   description DC3-INTFW1 agg-inside
   switchport mode trunk
   switchport trunk allowed vlan 3000,3100-3101,3105-3106
   mlag 11
   spanning-tree portfast
   spanning-tree bpduguard enable
!
interface Port-Channel1000
   description DC3-SL2 Port-Channel1000
   switchport mode trunk
   switchport trunk group MLAGPEER
!
interface Ethernet1/1
   description DC3-S1 Ethernet43/1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.27.4.85/31
   bfd interval 999 min-rx 999 multiplier 3
!
interface Ethernet2/1
   description DC3-S2 Ethernet43/1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.27.4.173/31
   bfd interval 999 min-rx 999 multiplier 3
!
interface Ethernet3/1
   description DC3-SL2 Ethernet3/1
   no shutdown
   channel-group 1000 mode active
!
interface Ethernet4/1
   description DC3-SL2 Ethernet4/1
   no shutdown
   channel-group 1000 mode active
!
interface Ethernet5/1
   description DC3-SL2 Ethernet5/1
   no shutdown
   channel-group 1000 mode active
!
interface Ethernet6/1
   description DC3-SL2 Ethernet6/1
   no shutdown
   channel-group 1000 mode active
!
interface Ethernet7/1
   description DC3-INTFW1 port19
   no shutdown
   channel-group 11 mode active
!
interface Ethernet24/1
   description DC3-SL2 Ethernet24/1
   no shutdown
   mtu 9214
   no switchport
   vrf VPC-KEEPALIVE
   ip address 10.27.17.4/31
!
interface Loopback0
   description Router ID, BGP peering
   ip address 10.27.0.25/32
!
interface Loopback1
   description VTEP source (Vxlan1), anycast from DC3-MLAG-SL1-SL2
   ip address 10.27.2.3/32
!
interface Loopback2
   description VTEP per-switch address
   ip address 10.27.1.23/32
!
interface Management1
   description OOB management
   vrf MGMT
   ip address 10.250.32.26/24
!
interface Vlan3000
   description DC3-TRANSIT-INTFW
   no shutdown
   mtu 9214
   vrf TRANSIT
   ip address 10.27.16.1/29
   bfd interval 999 min-rx 999 multiplier 3
!
interface Vlan3100
   description DC3-PROD-INTFW
   no shutdown
   mtu 9214
   vrf PROD
   ip address 10.27.8.1/29
   bfd interval 999 min-rx 999 multiplier 3
!
interface Vlan3101
   description DC3-DEV-INTFW
   no shutdown
   mtu 9214
   vrf DEV
   ip address 10.27.8.9/29
   bfd interval 999 min-rx 999 multiplier 3
!
interface Vlan3105
   description DC3-CITRIX-INTFW
   no shutdown
   mtu 9214
   vrf CITRIX
   ip address 10.27.8.41/29
   bfd interval 999 min-rx 999 multiplier 3
!
interface Vlan3106
   description DC3-PARTNER-INTFW
   no shutdown
   mtu 9214
   vrf PARTNER
   ip address 10.27.8.49/29
   bfd interval 999 min-rx 999 multiplier 3
!
interface Vlan3900
   description DC3-SL2 Vlan3900
   mtu 9214
   no autostate
   ip address 10.27.3.4/31
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan vrf CITRIX vni 50022
   vxlan vrf DEV vni 50002
   vxlan vrf PARTNER vni 50031
   vxlan vrf PROD vni 50001
   vxlan vrf TRANSIT vni 50100
!
ip virtual-router mac-address 0200.0000.00aa
ip virtual-router mac-address mlag-peer
!
ip routing
no ip routing vrf MGMT
ip routing vrf CITRIX
ip routing vrf DEV
ip routing vrf PARTNER
ip routing vrf PROD
ip routing vrf TRANSIT
!
ip prefix-list PL-DEFAULT
   seq 10 permit 0.0.0.0/0
!
ip prefix-list PL-LOOPBACKS
   seq 10 permit 10.27.0.0/24 eq 32
   seq 20 permit 10.27.1.0/24 eq 32
   seq 30 permit 10.27.2.0/25 eq 32
!
ip prefix-list PL-CITRIX-SUMMARY
   seq 10 permit 10.24.144.0/20
!
ip prefix-list PL-DEV-SUMMARY
   seq 10 permit 10.24.64.0/18
!
ip prefix-list PL-PARTNER-SUMMARY
   seq 10 permit 10.24.160.0/21
!
ip prefix-list PL-PROD-SUMMARY
   seq 10 permit 10.24.0.0/18
!
ip prefix-list PL-TRANSIT-SUMMARY
   seq 10 permit 10.24.144.0/20
   seq 20 permit 10.24.64.0/18
   seq 30 permit 10.24.160.0/21
   seq 40 permit 10.24.0.0/18
!
ip route vrf MGMT 0.0.0.0/0 10.250.32.1
ip route vrf PARTNER 10.24.160.0/21 Null0
!
mlag configuration
   domain-id DC3-MLAG-SL1-SL2
   local-interface Vlan3900
   peer-address 10.27.3.5
   peer-address heartbeat 10.27.17.5 vrf VPC-KEEPALIVE
   peer-link Port-Channel1000
   heartbeat-interval 4000
   dual-primary detection delay 5 action errdisable all-interfaces
   dual-primary recovery delay mlag 360 non-mlag 300
   reload-delay mlag 360
   reload-delay non-mlag 360
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS
!
route-map RM-CITRIX-FROM-FW permit 10
   match ip address prefix-list PL-DEFAULT
!
route-map RM-CITRIX-TO-FW permit 10
   match ip address prefix-list PL-CITRIX-SUMMARY
!
route-map RM-DEV-FROM-FW permit 10
   match ip address prefix-list PL-DEFAULT
!
route-map RM-DEV-TO-FW permit 10
   match ip address prefix-list PL-DEV-SUMMARY
!
route-map RM-PARTNER-FROM-FW permit 10
   match ip address prefix-list PL-DEFAULT
!
route-map RM-PARTNER-TO-FW permit 10
   match ip address prefix-list PL-PARTNER-SUMMARY
!
route-map RM-PROD-FROM-FW permit 10
   match ip address prefix-list PL-DEFAULT
!
route-map RM-PROD-TO-FW permit 10
   match ip address prefix-list PL-PROD-SUMMARY
!
route-map RM-TRANSIT-FROM-FW permit 10
   match ip address prefix-list PL-TRANSIT-SUMMARY
!
route-map RM-TRANSIT-TO-FW permit 10
   match ip address prefix-list PL-DEFAULT
!
router bfd
   multihop interval 999 min-rx 999 multiplier 3
!
router bgp 65372
   router-id 10.27.0.25
   no bgp default ipv4-unicast
   graceful-restart-helper
   maximum-paths 4 ecmp 4
   neighbor IPV4-UNDERLAY-PEERS peer group
   neighbor IPV4-UNDERLAY-PEERS remote-as 65300
   neighbor IPV4-UNDERLAY-PEERS bfd
   neighbor MLAG-IPV4-UNDERLAY-PEER peer group
   neighbor MLAG-IPV4-UNDERLAY-PEER remote-as 65372
   neighbor MLAG-IPV4-UNDERLAY-PEER next-hop-self
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS remote-as 65300
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor 10.27.4.84 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.27.4.172 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.27.3.5 peer group MLAG-IPV4-UNDERLAY-PEER
   neighbor 10.27.0.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.27.0.2 peer group EVPN-OVERLAY-PEERS
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      neighbor IPV4-UNDERLAY-PEERS activate
      neighbor MLAG-IPV4-UNDERLAY-PEER activate
   !
   vrf CITRIX
      rd 10.27.0.25:50022
      route-target import evpn 65300:50022
      route-target export evpn 65300:50022
      router-id 10.27.0.25
      neighbor 10.27.8.43 remote-as 65310
      neighbor 10.27.8.43 description DC3-CITRIX-INTFW
      neighbor 10.27.8.43 bfd
      aggregate-address 10.24.144.0/20
      redistribute connected
      !
      address-family ipv4
         neighbor 10.27.8.43 activate
         neighbor 10.27.8.43 route-map RM-CITRIX-FROM-FW in
         neighbor 10.27.8.43 route-map RM-CITRIX-TO-FW out
   !
   vrf DEV
      rd 10.27.0.25:50002
      route-target import evpn 65300:50002
      route-target export evpn 65300:50002
      router-id 10.27.0.25
      neighbor 10.27.8.11 remote-as 65310
      neighbor 10.27.8.11 description DC3-DEV-INTFW
      neighbor 10.27.8.11 bfd
      aggregate-address 10.24.64.0/18
      redistribute connected
      !
      address-family ipv4
         neighbor 10.27.8.11 activate
         neighbor 10.27.8.11 route-map RM-DEV-FROM-FW in
         neighbor 10.27.8.11 route-map RM-DEV-TO-FW out
   !
   vrf PARTNER
      rd 10.27.0.25:50031
      route-target import evpn 65300:50031
      route-target export evpn 65300:50031
      router-id 10.27.0.25
      neighbor 10.27.8.51 remote-as 65310
      neighbor 10.27.8.51 description DC3-PARTNER-INTFW
      neighbor 10.27.8.51 bfd
      network 10.24.160.0/21
      redistribute connected
      !
      address-family ipv4
         neighbor 10.27.8.51 activate
         neighbor 10.27.8.51 route-map RM-PARTNER-FROM-FW in
         neighbor 10.27.8.51 route-map RM-PARTNER-TO-FW out
   !
   vrf PROD
      rd 10.27.0.25:50001
      route-target import evpn 65300:50001
      route-target export evpn 65300:50001
      router-id 10.27.0.25
      neighbor 10.27.8.3 remote-as 65310
      neighbor 10.27.8.3 description DC3-PROD-INTFW
      neighbor 10.27.8.3 bfd
      aggregate-address 10.24.0.0/18
      redistribute connected
      !
      address-family ipv4
         neighbor 10.27.8.3 activate
         neighbor 10.27.8.3 route-map RM-PROD-FROM-FW in
         neighbor 10.27.8.3 route-map RM-PROD-TO-FW out
   !
   vrf TRANSIT
      rd 10.27.0.25:50100
      route-target import evpn 65300:50100
      route-target export evpn 65300:50100
      router-id 10.27.0.25
      neighbor 10.27.16.3 remote-as 65310
      neighbor 10.27.16.3 description DC3-TRANSIT-INTFW
      neighbor 10.27.16.3 bfd
      redistribute connected
      !
      address-family ipv4
         neighbor 10.27.16.3 activate
         neighbor 10.27.16.3 route-map RM-TRANSIT-FROM-FW in
         neighbor 10.27.16.3 route-map RM-TRANSIT-TO-FW out
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
end