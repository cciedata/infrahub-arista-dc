hostname DC3-DMZ2
!
service routing protocols model multi-agent
!
spanning-tree mode mstp
spanning-tree mst 0 priority 8192
!
aaa authentication login default local
aaa authorization exec default local
!
username dc3-automation privilege 15 role network-admin secret sha512 __DC3_AUTOMATION_HASH__
!
vlan 1400
   name DC3-DMZ-LB-VIP
!
vlan 1401
   name DC3-DMZ-LB-SELF
!
vlan 1402
   name DC3-DMZ-SRV-02
!
vlan 1403
   name DC3-DMZ-SRV-03
!
vlan 1404
   name DC3-DMZ-SRV-04
!
vlan 1405
   name DC3-DMZ-SRV-05
!
vlan 1406
   name DC3-DMZ-SRV-06
!
vlan 1407
   name DC3-DMZ-SRV-07
!
vlan 1408
   name DC3-DMZ-SRV-08
!
vlan 1409
   name DC3-DMZ-SRV-09
!
vlan 1410
   name DC3-DMZ-SRV-10
!
vlan 1411
   name DC3-DMZ-SRV-11
!
vlan 1412
   name DC3-DMZ-SRV-12
!
vlan 1413
   name DC3-DMZ-SRV-13
!
vlan 1414
   name DC3-DMZ-SRV-14
!
vlan 1415
   name DC3-DMZ-SRV-15
!
vlan 3900
   name VPC-BACKUP-UNDERLAY
   trunk group MLAGPEER
!
no spanning-tree vlan-id 3900
!
vrf instance MGMT
!
vrf instance VPC-KEEPALIVE
!
interface Port-Channel11
   description DC3-INETFW1 agg-dmz
   switchport mode trunk
   switchport trunk allowed vlan 1400-1415
   mlag 11
   spanning-tree portfast
   spanning-tree bpduguard enable
!
interface Port-Channel1000
   description DC3-DMZ1 Port-Channel1000
   switchport mode trunk
   switchport trunk group MLAGPEER
!
interface Ethernet48
   description DC3-DMZ1 Ethernet48
   no shutdown
   mtu 9214
   no switchport
   vrf VPC-KEEPALIVE
   ip address 10.27.17.9/31
!
interface Ethernet49/1
   description DC3-INETFW1 port16
   no shutdown
   channel-group 11 mode active
!
interface Ethernet53/1
   description DC3-DMZ1 Ethernet53/1
   no shutdown
   channel-group 1000 mode active
!
interface Ethernet54/1
   description DC3-DMZ1 Ethernet54/1
   no shutdown
   channel-group 1000 mode active
!
interface Management1
   description OOB management
   vrf MGMT
   ip address 10.250.32.31/24
!
interface Vlan3900
   description DC3-DMZ1 Vlan3900
   mtu 9214
   no autostate
   ip address 10.27.3.9/31
!
no ip routing vrf MGMT
!
ip route vrf MGMT 0.0.0.0/0 10.250.32.1
!
mlag configuration
   domain-id DC3-MLAG-DMZ1-DMZ2
   local-interface Vlan3900
   peer-address 10.27.3.8
   peer-address heartbeat 10.27.17.8 vrf VPC-KEEPALIVE
   peer-link Port-Channel1000
   heartbeat-interval 4000
   dual-primary detection delay 5 action errdisable all-interfaces
   dual-primary recovery delay mlag 360 non-mlag 300
   reload-delay mlag 360
   reload-delay non-mlag 360
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
end