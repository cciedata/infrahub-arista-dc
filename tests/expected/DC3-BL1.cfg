hostname DC3-BL1
!
service routing protocols model multi-agent
!
spanning-tree mode mstp
spanning-tree mst 0 priority 8192
!
aaa authentication login default local
aaa authorization exec default local
!
username dc3-automation privilege 15 role network-admin secret sha512 __DC3_AUTOMATION_HASH__
!
vlan 3001
   name DC3-TRANSIT-INETFW
!
vlan 3002
   name DC3-TRANSIT-SDWANFW
!
vlan 3003
   name DC3-TRANSIT-CLOUD1
!
vlan 3004
   name DC3-TRANSIT-CLOUD2
!
vlan 3300
   name DC3-PARTNER-VPNFW
!
vlan 3900
   name VPC-BACKUP-UNDERLAY
   trunk group MLAGPEER
!
no spanning-tree vlan-id 3900
!
vrf instance MGMT
!
vrf instance PARTNER
!
vrf instance TRANSIT
!
vrf instance VPC-KEEPALIVE
!
interface Port-Channel11
   description DC3-INETFW1 agg-inside
   switchport mode trunk
   switchport trunk allowed vlan 3001
   mlag 11
   spanning-tree portfast
   spanning-tree bpduguard enable
!
interface Port-Channel13
   description DC3-SDWANFW1 agg-inside
   switchport mode trunk
   switchport trunk allowed vlan 3002
   mlag 13
   spanning-tree portfast
   spanning-tree bpduguard enable
!
interface Port-Channel15
   description DC3-VPNFW1 agg-inside
   switchport mode trunk
   switchport trunk allowed vlan 3300
   mlag 15
   spanning-tree portfast
   spanning-tree bpduguard enable
!
interface Port-Channel31
   description DC3-CLOUD1 BE31
   switchport mode trunk
   switchport trunk allowed vlan 3003
   mlag 31
   spanning-tree portfast
   spanning-tree bpduguard enable
!
interface Port-Channel32
   description DC3-CLOUD2 BE31
   switchport mode trunk
   switchport trunk allowed vlan 3004
   mlag 32
   spanning-tree portfast
   spanning-tree bpduguard enable
!
interface Port-Channel1000
   description DC3-BL2 Port-Channel1000
   switchport mode trunk
   switchport trunk group MLAGPEER
!
interface Ethernet1/1
   description DC3-S1 Ethernet41/1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.27.4.81/31
   bfd interval 999 min-rx 999 multiplier 3
!
interface Ethernet2/1
   description DC3-S2 Ethernet41/1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.27.4.169/31
   bfd interval 999 min-rx 999 multiplier 3
!
interface Ethernet3/1
   description DC3-BL2 Ethernet3/1
   no shutdown
   channel-group 1000 mode active
!
interface Ethernet4/1
   description DC3-BL2 Ethernet4/1
   no shutdown
   channel-group 1000 mode active
!
interface Ethernet5/1
   description DC3-BL2 Ethernet5/1
   no shutdown
   channel-group 1000 mode active
!
interface Ethernet6/1
   description DC3-BL2 Ethernet6/1
   no shutdown
   channel-group 1000 mode active
!
interface Ethernet7/1
   description DC3-INETFW1 port19
   no shutdown
   channel-group 11 mode active
!
interface Ethernet9/1
   description DC3-SDWANFW1 port37
   no shutdown
   channel-group 13 mode active
!
interface Ethernet11/1
   description DC3-VPNFW1 port37
   no shutdown
   channel-group 15 mode active
!
interface Ethernet13/1
   description DC3-CLOUD1 Gi0-0-0-0
   no shutdown
   channel-group 31 mode active
!
interface Ethernet14/1
   description DC3-CLOUD2 Gi0-0-0-0
   no shutdown
   channel-group 32 mode active
!
interface Ethernet24/1
   description DC3-BL2 Ethernet24/1
   no shutdown
   mtu 9214
   no switchport
   vrf VPC-KEEPALIVE
   ip address 10.27.17.2/31
!
interface Loopback0
   description Router ID, BGP peering
   ip address 10.27.0.23/32
!
interface Loopback1
   description VTEP source (Vxlan1), anycast from DC3-MLAG-BL1-BL2
   ip address 10.27.2.2/32
!
interface Loopback2
   description VTEP per-switch address
   ip address 10.27.1.21/32
!
interface Management1
   description OOB management
   vrf MGMT
   ip address 10.250.32.24/24
!
interface Vlan3001
   description DC3-TRANSIT-INETFW
   no shutdown
   mtu 9214
   vrf TRANSIT
   ip address 10.27.16.9/29
   bfd interval 999 min-rx 999 multiplier 3
!
interface Vlan3002
   description DC3-TRANSIT-SDWANFW
   no shutdown
   mtu 9214
   vrf TRANSIT
   ip address 10.27.16.17/29
   bfd interval 999 min-rx 999 multiplier 3
!
interface Vlan3003
   description DC3-TRANSIT-CLOUD1
   no shutdown
   mtu 9214
   vrf TRANSIT
   ip address 10.27.16.25/29
   bfd interval 999 min-rx 999 multiplier 3
!
interface Vlan3004
   description DC3-TRANSIT-CLOUD2
   no shutdown
   mtu 9214
   vrf TRANSIT
   ip address 10.27.16.33/29
   bfd interval 999 min-rx 999 multiplier 3
!
interface Vlan3300
   description DC3-PARTNER-VPNFW
   no shutdown
   mtu 9214
   vrf PARTNER
   ip address 10.27.9.1/29
   bfd interval 999 min-rx 999 multiplier 3
!
interface Vlan3900
   description DC3-BL2 Vlan3900
   mtu 9214
   no autostate
   ip address 10.27.3.2/31
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan vrf PARTNER vni 50031
   vxlan vrf TRANSIT vni 50100
!
ip virtual-router mac-address 0200.0000.00aa
ip virtual-router mac-address mlag-peer
!
ip routing
no ip routing vrf MGMT
ip routing vrf PARTNER
ip routing vrf TRANSIT
!
ip prefix-list PL-DEFAULT
   seq 10 permit 0.0.0.0/0
!
ip prefix-list PL-CLOUD
   seq 10 permit 172.16.0.0/13 le 24
   seq 20 permit 172.30.0.0/15 le 24
!
ip prefix-list PL-BRANCH-SUMMARY
   seq 10 permit 10.64.0.0/12
!
ip prefix-list PL-LOOPBACKS
   seq 10 permit 10.27.0.0/24 eq 32
   seq 20 permit 10.27.1.0/24 eq 32
   seq 30 permit 10.27.2.0/25 eq 32
!
ip prefix-list PL-PARTNER-NAT
   seq 10 permit 10.24.160.0/21 ge 28 le 28
!
ip prefix-list PL-TRANSIT-SUMMARY
   seq 10 permit 10.24.144.0/20
   seq 20 permit 10.24.64.0/18
   seq 30 permit 10.24.160.0/21
   seq 40 permit 10.24.0.0/18
!
ip prefix-list PL-TRANSIT-SDWAN-OUT
   seq 10 permit 10.24.144.0/20
   seq 20 permit 10.24.64.0/18
   seq 30 permit 10.24.0.0/18
!
ip route vrf MGMT 0.0.0.0/0 10.250.32.1
ip route vrf PARTNER 10.24.160.0/21 Null0
!
mlag configuration
   domain-id DC3-MLAG-BL1-BL2
   local-interface Vlan3900
   peer-address 10.27.3.3
   peer-address heartbeat 10.27.17.3 vrf VPC-KEEPALIVE
   peer-link Port-Channel1000
   heartbeat-interval 4000
   dual-primary detection delay 5 action errdisable all-interfaces
   dual-primary recovery delay mlag 360 non-mlag 300
   reload-delay mlag 360
   reload-delay non-mlag 360
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS
!
route-map RM-PARTNER-FROM-FW permit 10
   match ip address prefix-list PL-PARTNER-NAT
!
route-map RM-PARTNER-TO-FW permit 10
   match ip address prefix-list PL-DEFAULT
!
route-map RM-TRANSIT-FROM-CLOUD permit 10
   match ip address prefix-list PL-CLOUD
!
route-map RM-TRANSIT-FROM-FW permit 10
   match ip address prefix-list PL-DEFAULT
!
route-map RM-TRANSIT-FROM-SDWAN permit 10
   match ip address prefix-list PL-BRANCH-SUMMARY
!
route-map RM-TRANSIT-TO-CLOUD permit 10
   match ip address prefix-list PL-DEFAULT
!
route-map RM-TRANSIT-TO-CLOUD permit 20
   match ip address prefix-list PL-TRANSIT-SUMMARY
!
route-map RM-TRANSIT-TO-FW permit 10
   match ip address prefix-list PL-TRANSIT-SUMMARY
!
route-map RM-TRANSIT-TO-SDWAN permit 10
   match ip address prefix-list PL-TRANSIT-SDWAN-OUT
!
route-map RM-TRANSIT-TO-SDWAN permit 20
   match ip address prefix-list PL-CLOUD
!
router bfd
   multihop interval 999 min-rx 999 multiplier 3
!
router bgp 65371
   router-id 10.27.0.23
   no bgp default ipv4-unicast
   graceful-restart-helper
   maximum-paths 4 ecmp 4
   neighbor IPV4-UNDERLAY-PEERS peer group
   neighbor IPV4-UNDERLAY-PEERS remote-as 65300
   neighbor IPV4-UNDERLAY-PEERS bfd
   neighbor MLAG-IPV4-UNDERLAY-PEER peer group
   neighbor MLAG-IPV4-UNDERLAY-PEER remote-as 65371
   neighbor MLAG-IPV4-UNDERLAY-PEER next-hop-self
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS remote-as 65300
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor 10.27.4.80 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.27.4.168 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.27.3.3 peer group MLAG-IPV4-UNDERLAY-PEER
   neighbor 10.27.0.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.27.0.2 peer group EVPN-OVERLAY-PEERS
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      neighbor IPV4-UNDERLAY-PEERS activate
      neighbor MLAG-IPV4-UNDERLAY-PEER activate
   !
   vrf PARTNER
      rd 10.27.0.23:50031
      route-target import evpn 65300:50031
      route-target export evpn 65300:50031
      router-id 10.27.0.23
      neighbor 10.27.9.3 remote-as 65330
      neighbor 10.27.9.3 description DC3-PARTNER-VPNFW
      neighbor 10.27.9.3 bfd
      network 10.24.160.0/21
      redistribute connected
      !
      address-family ipv4
         neighbor 10.27.9.3 activate
         neighbor 10.27.9.3 route-map RM-PARTNER-FROM-FW in
         neighbor 10.27.9.3 route-map RM-PARTNER-TO-FW out
   !
   vrf TRANSIT
      rd 10.27.0.23:50100
      route-target import evpn 65300:50100
      route-target export evpn 65300:50100
      router-id 10.27.0.23
      neighbor 10.27.16.11 remote-as 65340
      neighbor 10.27.16.11 description DC3-TRANSIT-INETFW
      neighbor 10.27.16.11 bfd
      neighbor 10.27.16.19 remote-as 65320
      neighbor 10.27.16.19 description DC3-TRANSIT-SDWANFW
      neighbor 10.27.16.19 bfd
      neighbor 10.27.16.27 remote-as 65370
      neighbor 10.27.16.27 description DC3-TRANSIT-CLOUD1
      neighbor 10.27.16.27 bfd
      neighbor 10.27.16.35 remote-as 65370
      neighbor 10.27.16.35 description DC3-TRANSIT-CLOUD2
      neighbor 10.27.16.35 bfd
      maximum-paths 2
      redistribute connected
      !
      address-family ipv4
         neighbor 10.27.16.11 activate
         neighbor 10.27.16.11 route-map RM-TRANSIT-FROM-FW in
         neighbor 10.27.16.11 route-map RM-TRANSIT-TO-FW out
         neighbor 10.27.16.19 activate
         neighbor 10.27.16.19 route-map RM-TRANSIT-FROM-SDWAN in
         neighbor 10.27.16.19 route-map RM-TRANSIT-TO-SDWAN out
         neighbor 10.27.16.27 activate
         neighbor 10.27.16.27 route-map RM-TRANSIT-FROM-CLOUD in
         neighbor 10.27.16.27 route-map RM-TRANSIT-TO-CLOUD out
         neighbor 10.27.16.35 activate
         neighbor 10.27.16.35 route-map RM-TRANSIT-FROM-CLOUD in
         neighbor 10.27.16.35 route-map RM-TRANSIT-TO-CLOUD out
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
end